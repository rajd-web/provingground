name: Update tracks.json

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sanity check secrets exist (no values printed)
        env:
          PG_API_KEY: ${{ secrets.PG_API_KEY }}
          PG_STATE_URL: ${{ secrets.PG_STATE_URL }}
          PG_RESOURCE_IDS: ${{ secrets.PG_RESOURCE_IDS }}
          PG_TITLE: ${{ secrets.PG_TITLE }}
        run: |
          set -e
          [ -n "$PG_API_KEY" ] || (echo "PG_API_KEY is empty" && exit 1)
          [ -n "$PG_STATE_URL" ] || (echo "PG_STATE_URL is empty" && exit 1)
          [ -n "$PG_RESOURCE_IDS" ] || (echo "PG_RESOURCE_IDS is empty" && exit 1)
          [ -n "$PG_TITLE" ] || (echo "PG_TITLE is empty" && exit 1)
          echo "Secrets look non-empty ✅"

      - name: Fetch resource states (JSON via api_key)
        env:
          PG_API_KEY: ${{ secrets.PG_API_KEY }}
          PG_STATE_URL: ${{ secrets.PG_STATE_URL }}
        run: |
          set -e
          # Do not echo full URL (api_key must not leak into logs)
          curl -sS -L --fail "${PG_STATE_URL}?api_key=${PG_API_KEY}" -o resourcestate.json
          echo "Fetched resourcestate.json ✅"

      - name: Build tracks.json (filter selected IDs)
        env:
          PG_RESOURCE_IDS: ${{ secrets.PG_RESOURCE_IDS }}
          PG_TITLE: ${{ secrets.PG_TITLE }}
        run: |
          python3 - << 'PY'
          import json, os

          ids = set(int(x.strip()) for x in os.environ["PG_RESOURCE_IDS"].split(",") if x.strip())
          title = os.environ.get("PG_TITLE","My Tracks")

          with open("resourcestate.json","r",encoding="utf-8") as f:
            data = json.load(f)

          # data kan vara list eller wrapper-dict. Vi gör robust.
          items = data
          if isinstance(data, dict):
            # gissa vanliga wrapper-fält
            for k in ["resources","resourcestate","states","data","items"]:
              if k in data and isinstance(data[k], list):
                items = data[k]
                break
            else:
              items = data.get("items", []) if isinstance(data.get("items"), list) else []

          out_tracks = []
          for x in items:
            # försök tolka id & fält
            rid = x.get("resourceid") or x.get("id") or x.get("resourceId")
            try:
              rid_i = int(rid)
            except Exception:
              continue

            if rid_i not in ids:
              continue

            out_tracks.append({
              "id": rid_i,
              "name": x.get("resourcename") or x.get("name") or f"Track {rid_i}",
              "state": x.get("resourcestate") or x.get("state") or x.get("resourceState"),
              "activeState": x.get("resourceactivestate") or x.get("activeState"),
              "capacity": x.get("capacity") or x.get("resourcecapacity") or "",
              "info": (x.get("resourceinformation") or x.get("info") or "").strip()
            })

          out_tracks.sort(key=lambda t: t["id"])

          out = {
            "title": title,
            "generatedAt": __import__("datetime").datetime.utcnow().isoformat() + "Z",
            "tracks": out_tracks
          }

          with open("tracks.json","w",encoding="utf-8") as f:
            json.dump(out, f, ensure_ascii=False, indent=2)

          print(f"tracks.json written with {len(out_tracks)} entries")
          PY

      - name: Commit & push if changed (includes new file)
        run: |
          set -e
          git add tracks.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tracks.json"
          git push
